<!doctype html>
<html>
  <head>
    <script>
      function showHidePassword() {
        var inputDomElement = document.getElementById("input");
        var label = document.querySelector("label");

        if (inputDomElement.type === "password") {
          inputDomElement.type = "text";
          label.innerText = "Uncheck to Hide Password";
        } else {
          inputDomElement.type = "password";
          label.innerText = "Check to Show Password";
        }
      }
    </script>
    <style>
      body {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h1>Show / Hide Password</h1>
    <input type="password" placeholder="password" id="input" />
    <input type="checkbox" id="check" onchange="showHidePassword()" />
    <label for="check">Check to Show Password</label>
  </body>
</html>
